
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Village Life</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Village Life</h1>
        <p>Good times. Real friends. Unforgettable memories.</p>
    </header>

    <main>
        <section class="my-profile">
            <img src="images/me.jpg.jpeg" alt="My photo">
            <h2>That's Me!</h2>
            <p>My life, my village, my people.</p>
        </section>

        <section class="friends">
            <h2>My Hangout Gang</h2>

            <img id="friendPhoto"
                 src="images/friend1.jpg.jpeg"
                 alt="My friend">

            <h3 id="friendName">Friend 1</h3>
            <p id="friendNumber">Friend 1 of 3</p>

            <button onclick="nextFriend()">
                Next Friend →
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
